[package]
name = "daovibe-desktop-node"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "DAOVibe independent desktop node foundation"
license = "MIT"

[[bin]]
name = "daovibe-desktop"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
uuid = { version = "1.11", features = ["v4"] }
